<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f1e8">
<title>黄金矿工 · GOLD DIGGER</title>
<style>
:root{color-scheme:light dark;--bg:#f5f1e8;--surface:#fffdf7;--ink:#302d25;--muted:#6f695c;--line:#d9d1bf;--gold:#efbb4f;--button:#302d25;--onbutton:#fffdf7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:10px 18px;background:var(--surface);color:var(--ink);font-weight:650}button:hover{filter:brightness(.94)}button:focus-visible{outline:3px solid #3784bd;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--button);color:var(--onbutton);border-color:var(--button)}.gold{background:var(--gold);color:#302516;border-color:#b57f23}.wrap{max-width:1168px;margin:auto;padding:28px 24px 20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px}.brand{display:flex;gap:12px;align-items:center}.mark{display:grid;place-items:center;width:44px;height:44px;background:var(--gold);color:#302516;border-radius:10px;font-size:25px;font-weight:900}.brand strong{display:block;font-size:23px;letter-spacing:1px}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:2px;font-weight:700}.top-actions{display:flex;gap:8px}.top-actions button{padding:8px 12px;font-size:14px}.stats{display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:16px}.stat{padding:14px 24px;position:relative}.stat:not(:last-child):after{content:"";position:absolute;right:0;top:20px;bottom:20px;width:1px;background:var(--line)}.stat label{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}.stat strong{font-size:29px;line-height:1.3;font-variant-numeric:tabular-nums}.stat strong small{font-size:15px;font-weight:500}.progress{height:4px;background:var(--line);margin-top:7px;border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;background:#987321;width:0;transition:width .2s}.stage{position:relative;overflow:hidden;border-radius:12px;background:#48392c;border:1px solid #68503c;isolation:isolate}canvas{display:block;width:100%;aspect-ratio:1120/620;touch-action:manipulation}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(28,24,18,.48);padding:16px;backdrop-filter:blur(3px)}.overlay[hidden]{display:none}.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:430px;width:100%;padding:30px;text-align:center;box-shadow:0 16px 50px #0003}.card .tag{font-size:12px;letter-spacing:3px;color:var(--muted);font-weight:700}.card h1{font-size:38px;line-height:1.15;margin:12px 0}.card p{color:var(--muted);margin:12px 0 22px}.card button{width:100%}.card .sub{margin-top:10px;background:transparent}.card .instructions{font-size:14px;margin-bottom:0}.gamebar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0}.gamebar p{margin:0;font-size:14px;color:var(--muted)}.controls{display:flex;gap:8px;flex-shrink:0}.controls button{min-width:100px}kbd{font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink)}.legend{display:flex;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:8px}.dot{width:12px;height:12px;display:inline-block;border-radius:3px;background:#e4af3c;transform:rotate(-10deg)}.dot.gray{background:#8a928f}.dot.blue{background:#67d3de;transform:rotate(45deg)}.dot.bag{background:#b6895b;border-radius:50%}.record{margin-left:auto}footer{display:flex;justify-content:space-between;gap:12px;padding-top:20px;font-size:12px;letter-spacing:.3px;color:var(--muted)}.low{color:#b23b2f!important}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}@media(prefers-color-scheme:dark){:root{--bg:#1f221e;--surface:#282b25;--ink:#faf4e8;--muted:#bcb7a8;--line:#4c4e40;--button:#edbd59;--onbutton:#302516}}@media(max-width:600px){.wrap{padding:16px}.brand strong{font-size:19px}.eyebrow{font-size:10px}.mark{width:38px;height:38px}.brand .eyebrow{font-size:0;letter-spacing:1.5px}.brand .eyebrow:before{content:"GOLD DIGGER";font-size:10px}.top-actions{gap:6px;flex-shrink:0}.top-actions button{font-size:12px;padding:6px 9px;white-space:nowrap}header{gap:8px;margin-bottom:16px}.stats{grid-template-columns:1fr 1fr;margin-bottom:12px}.stat{padding:10px 16px}.stat strong{font-size:25px}.stat:nth-child(2):after{display:none}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}canvas{aspect-ratio:390/450}.card{padding:22px}.card h1{font-size:32px}.card p{margin:10px 0 16px}.gamebar{flex-direction:column;align-items:stretch;gap:12px}.controls button{flex:1}.legend{gap:10px 16px}.record{margin-left:0;width:100%}footer{padding-top:16px}.desktop-tip{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
<header><div class="brand"><div class="mark" aria-hidden="true">⛏</div><div><strong>黄金矿工</strong><div class="eyebrow">GOLD DIGGER / 小小淘金，大大快乐</div></div></div><div class="top-actions"><button id="sound" aria-pressed="false">声音：关</button><button id="pause">暂停</button></div></header>
<section class="stats" aria-label="游戏状态"><div class="stat"><label>当前收益</label><strong id="score">$0</strong></div><div class="stat"><label>本关目标</label><strong id="target">$650</strong><div class="progress"><i id="progress"></i></div></div><div class="stat"><label>剩余时间</label><strong id="timer">60 <small>秒</small></strong></div><div class="stat"><label>探索进度</label><strong><span id="level">01</span> <small>/ 关卡</small></strong></div></section>
<div class="stage"><canvas id="game" width="1120" height="620" tabindex="0" aria-label="黄金矿工游戏区域，按空格或点击出钩，X使用炸药，P暂停"></canvas><div class="overlay" id="overlay"><section class="card" aria-labelledby="modal-title"><div class="tag" id="modal-tag">THE GOLD RUSH IS ON</div><h1 id="modal-title">下一钩，好运！</h1><p id="modal-desc">瞄准闪亮的金块，抓住你的淘金时刻。<br>60 秒内达成目标，解锁全新矿区。</p><button class="gold" id="main">开始淘金 →</button><button class="sub" id="secondary" hidden>继续游戏</button><p class="instructions" id="modal-help">点击画面 / 空格出钩 · X 炸药<br>手机可点下方按钮，或直接轻触矿区</p></section></div></div>
<div class="gamebar"><p><span id="hint">慢慢瞄准，大金块值得等待。</span><span class="desktop-tip"> <kbd>空格</kbd> 出钩 · <kbd>X</kbd> 炸药 · <kbd>P</kbd> 暂停</span></p><div class="controls"><button id="bomb">炸药 × <span id="bombs">2</span></button><button class="primary" id="fire">↓ 出钩</button></div></div>
<div class="legend"><span><i class="dot"></i>黄金 $100–500</span><span><i class="dot blue"></i>钻石 $800</span><span><i class="dot gray"></i>石头 $30</span><span><i class="dot bag"></i>福袋 $100–600</span><span class="record">个人纪录 <b id="best">$0</b></span></div>
<footer><span>一钩一世界，今天也要满载而归。</span><span>无需下载 · 即开即玩</span></footer>
<p class="sr" id="announce" aria-live="polite"></p>
</main>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const W=1120,H=620,origin={x:560,y:108};let state='ready',level=1,score=0,target=650,seconds=60,bombs=2,best=0,angle=-.85,dir=1,rope=26,hook='swing',caught=null,items=[],particles=[],texts=[],last=0,elapsed=0,sound=false,audio=null,mainAction=null;
try{best=Number(localStorage.getItem('gold-digger-best')||0)||0}catch{}$('best').textContent='$'+best;
let seed=17;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296},rand=(a,b)=>a+rnd()*(b-a);
function tone(freq,duration=.12){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function hud(){ $('score').textContent='$'+score;$('target').textContent='$'+target;$('level').textContent=String(level).padStart(2,'0');$('bombs').textContent=bombs;$('timer').innerHTML=Math.ceil(seconds)+' <small>秒</small>';$('timer').classList.toggle('low',seconds<=10);$('progress').style.width=Math.min(100,score/target*100)+'%';$('bomb').disabled=state!=='playing'||hook!=='retract'||!caught||bombs<1;$('fire').disabled=state!=='playing'||hook!=='swing';$('pause').disabled=!['playing','paused'].includes(state);$('pause').textContent=state==='paused'?'继续':'暂停'}
function generate(){seed=29+level*243;items=[];const types=['large','large','medium','medium','medium','small','small','small','rock','rock','rock','diamond','bag'];if(level>2)types.push('rock','diamond');for(const type of types){const r={large:39,medium:27,small:18,rock:31,diamond:17,bag:23}[type];let x,y,ok=false;for(let j=0;j<300;j++){x=rand(70,W-70);y=rand(235,H-60);ok=items.every(o=>Math.hypot(o.x-x,o.y-y)>o.r+r+18);if(ok)break}if(!ok)continue;items.push({type,x,y,r,value:{large:500,medium:250,small:100,rock:30,diamond:800,bag:Math.floor(rand(1,7))*100}[type],weight:{large:3.1,medium:1.8,small:.85,rock:4.3,diamond:.65,bag:1.3}[type],rot:rand(-.4,.4),phase:rand(0,6)})}}
function modal(tag,title,desc,label,action,secondary=false){$('modal-tag').textContent=tag;$('modal-title').textContent=title;$('modal-desc').textContent=desc;$('main').textContent=label;mainAction=action;$('secondary').hidden=!secondary;$('modal-help').hidden=state!=='ready';$('overlay').hidden=false;hud()}
function begin(fresh=true){if(fresh){level=1;score=0;target=650;bombs=2}seconds=60;angle=-.85;dir=1;rope=26;hook='swing';caught=null;particles=[];texts=[];generate();state='playing';$('overlay').hidden=true;$('hint').textContent='慢慢瞄准，大金块值得等待。';tone(440);hud()}
function save(){if(score>best){best=score;try{localStorage.setItem('gold-digger-best',String(best))}catch{}$('best').textContent='$'+best}}
function finish(){save();if(score>=target){state='won';modal('NICE CATCH · 矿区完成','满载而归！','累计收益 $'+score+'，已达成目标！下一关追加目标，时间重置，并补充 1 份炸药。','前往下一矿区 →',()=>{level++;target+=Math.round((750+(level-2)*250)/50)*50;bombs++;begin(false)})}else{state='over';modal('ONE MORE TRY · 下次一定','差一点，就挖到了','本次收益 $'+score+' / 目标 $'+target+'。小金块和钻石回收更快，不妨换个策略。','再来一局 →',()=>begin(true))}}
function endPoint(){return{x:origin.x+Math.sin(angle)*rope,y:origin.y+Math.cos(angle)*rope}}
function shoot(){if(state!=='playing'||hook!=='swing')return;hook='extend';tone(230,.08);hud()}
function explode(){if(state!=='playing'||hook!=='retract'||!caught||bombs<1)return;bombs--;burst(caught.x,caught.y,'#f4b448',28);caught=null;tone(90,.25);$('hint').textContent='轻装上阵！继续寻找高价值矿物。';hud()}
function pause(){if(state==='playing'){state='paused';modal('TAKE A BREATHER','休息一下','矿区已暂停，计时也停下来了。准备好了就继续。','继续淘金 →',resume,true);$('secondary').textContent='重新开始';}else if(state==='paused')resume()}
function resume(){state='playing';$('overlay').hidden=true;hud()}
function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-130,130),vy:rand(-160,40),life:rand(.3,.8),max:.8,color})}
function collect(){if(caught){score+=caught.value;save();texts.push({x:origin.x,y:150,text:'+$'+caught.value,life:1.2});burst(origin.x,origin.y,'#ffd977');tone(caught.type==='rock'?170:690,.18);$('announce').textContent='获得 '+caught.value+'，当前收益 '+score;$('hint').textContent=score>=target?'目标达成！继续收集，收益带入下一关。':caught.type==='rock'?'石头有点重，下次可以用炸药放弃。':'漂亮的一钩！继续寻找闪光的矿物。';caught=null;}hook='swing';rope=26;hud()}
function update(dt){elapsed+=dt;for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt}particles=particles.filter(p=>p.life>0);for(const t of texts){t.life-=dt;t.y-=28*dt}texts=texts.filter(t=>t.life>0);if(state!=='playing')return;seconds=Math.max(0,seconds-dt);if(seconds===0){finish();return}if(hook==='swing'){angle+=dir*dt*(.9+Math.min(level,8)*.025);if(angle>1.17){angle=1.17;dir=-1}if(angle< -1.17){angle=-1.17;dir=1}}else if(hook==='extend'){// Sweep in short steps so the hook cannot skip small targets.
const distance=dt*500,steps=Math.max(1,Math.ceil(distance/7));for(let j=0;j<steps;j++){rope+=distance/steps;const p=endPoint();const hit=items.find(o=>Math.hypot(o.x-p.x,o.y-p.y)<o.r+9);if(hit){caught=hit;items=items.filter(o=>o!==hit);hook='retract';tone(340,.06);break}if(p.x<24||p.x>W-24||p.y>H-18){hook='retract';break}}}else{rope=Math.max(26,rope-dt*(caught?255/caught.weight:610));if(caught){const p=endPoint();caught.x=p.x;caught.y=p.y+caught.r*.4}if(rope<=26)collect()}hud()}
function path(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function mineral(o){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);const r=o.r;if(o.type==='diamond'){path([[0,-r],[r,-r*.25],[0,r],[-r,-r*.25]],'#8ae8e3','#d6ffec');path([[0,-r],[-r,-r*.25],[0,-r*.15]],'#e2fff4');path([[0,-r*.15],[r,-r*.25],[0,r]],'#4faab7');}else if(o.type==='bag'){ctx.fillStyle='#b88554';ctx.beginPath();ctx.ellipse(0,4,r*.8,r,0,0,Math.PI*2);ctx.fill();path([[-9,-r],[10,-r],[5,-r*.5],[-5,-r*.5]],'#d9ac77');ctx.strokeStyle='#69482e';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-10,-r*.5);ctx.lineTo(10,-r*.5);ctx.stroke();ctx.fillStyle='#573d2a';ctx.font='bold 23px system-ui';ctx.textAlign='center';ctx.fillText('?',0,12)}else{const rock=o.type==='rock';path([[-r*.9,-r*.32],[-r*.4,-r*.9],[r*.35,-r*.82],[r*.95,-r*.1],[r*.65,r*.65],[-r*.3,r*.9],[-r,r*.3]],rock?'#87918d':'#eab741',rock?'#a6b0a9':'#f8d778');path([[-r*.9,-r*.32],[-r*.4,-r*.9],[r*.35,-r*.82],[r*.15,-r*.15]],rock?'#acb4aa':'#ffdf76');path([[r*.15,-r*.15],[r*.95,-r*.1],[r*.65,r*.65],[-r*.3,r*.9]],rock?'#687470':'#c58c2a');if(!rock){ctx.strokeStyle='#fff1ae';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-r*.45,-r*.3);ctx.lineTo(-r*.2,-r*.5);ctx.stroke()}}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,165);sky.addColorStop(0,'#c7dbcd');sky.addColorStop(1,'#e9dfb7');ctx.fillStyle=sky;ctx.fillRect(0,0,W,170);ctx.fillStyle='#f8e9b4';ctx.beginPath();ctx.arc(940,50,32,0,Math.PI*2);ctx.fill();path([[0,120],[100,60],[180,101],[285,35],[420,126],[560,68],[700,123],[830,55],[1000,126],[1120,70],[1120,170],[0,170]],'#acbba0');path([[0,140],[145,96],[280,148],[410,99],[575,150],[735,113],[900,142],[1030,100],[1120,138],[1120,175],[0,175]],'#819b79');ctx.fillStyle='#42372b';ctx.fillRect(0,170,W,H);const earth=ctx.createLinearGradient(0,170,0,H);earth.addColorStop(0,'#5d4633');earth.addColorStop(1,'#302d29');ctx.fillStyle=earth;ctx.fillRect(0,170,W,H);path([[0,157],[160,159],[260,153],[420,159],[610,154],[800,158],[950,152],[1120,158],[1120,173],[0,173]],'#5f7350');ctx.fillStyle='#95734d';ctx.fillRect(0,172,W,5);
// Deterministic earth strata and pebbles, not image assets.
ctx.strokeStyle='#c59a6520';ctx.lineWidth=2;for(let j=0;j<5;j++){ctx.beginPath();for(let x=0;x<=W;x+=25){const y=215+j*93+Math.sin(x*.012+j)*12;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}ctx.fillStyle='#d4b98a20';for(let i=0;i<90;i++){const x=(i*173+31)%W,y=195+(i*97)%410;ctx.fillRect(x,y,i%3+2,2)}
// Gantry, winch, and miner are procedural gameplay sprites.
ctx.fillStyle='#715135';ctx.fillRect(489,68,12,90);ctx.fillRect(619,68,12,90);ctx.fillStyle='#906a40';ctx.fillRect(481,61,158,13);ctx.fillRect(483,146,156,12);ctx.strokeStyle='#c6b080';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(493,82);ctx.lineTo(627,141);ctx.moveTo(627,82);ctx.lineTo(493,141);ctx.stroke();ctx.fillStyle='#2d3b3b';ctx.fillRect(541,86,39,33);ctx.fillStyle='#abb6a0';ctx.beginPath();ctx.arc(560,103,17,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#536051';ctx.lineWidth=4;ctx.beginPath();ctx.arc(560,103,10,0,Math.PI*2);ctx.stroke();
ctx.fillStyle='#35514a';ctx.fillRect(659,113,29,34);ctx.fillStyle='#e2b58a';ctx.beginPath();ctx.arc(673,97,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#edb93d';ctx.beginPath();ctx.arc(673,91,18,Math.PI,0);ctx.fill();ctx.fillRect(652,89,43,6);ctx.fillStyle='#fff1c2';ctx.fillRect(668,78,11,9);ctx.fillStyle='#302e27';ctx.fillRect(679,99,3,3);ctx.fillRect(659,145,12,12);ctx.fillRect(678,145,12,12);
items.forEach(mineral);if(caught)mineral(caught);const p=endPoint();ctx.strokeStyle='#d4c39a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(origin.x,origin.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-angle);ctx.strokeStyle='#d5ddd2';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-5);ctx.lineTo(0,6);ctx.moveTo(-4,1);ctx.lineTo(-13,14);ctx.lineTo(-9,24);ctx.moveTo(4,1);ctx.lineTo(13,14);ctx.lineTo(9,24);ctx.stroke();ctx.restore();for(const q of particles){ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.color;ctx.fillRect(q.x,q.y,5,5)}ctx.globalAlpha=1;for(const t of texts){ctx.globalAlpha=Math.min(1,t.life*2);ctx.font='bold 28px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff0a8';ctx.fillText(t.text,t.x,t.y)}ctx.globalAlpha=1;
}
function frame(now){const dt=Math.min((now-last)/1000||0,.04);last=now;if(state!=='paused')update(dt);draw();requestAnimationFrame(frame)}
function resize(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}
$('main').onclick=()=>mainAction&&mainAction();$('secondary').onclick=()=>begin(true);$('fire').onclick=shoot;canvas.addEventListener('pointerdown',e=>{e.preventDefault();shoot()});$('bomb').onclick=explode;$('pause').onclick=pause;$('sound').onclick=()=>{sound=!sound;$('sound').textContent='声音：'+(sound?'开':'关');$('sound').setAttribute('aria-pressed',String(sound));tone(520)};
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.altKey||e.metaKey)return;if(['Space','ArrowDown','KeyX','KeyP','Escape'].includes(e.code)&&e.target.tagName!=='BUTTON'){e.preventDefault();if(e.code==='Space'||e.code==='ArrowDown'){if(state==='ready')begin();else shoot()}if(e.code==='KeyX')explode();if(e.code==='KeyP'||e.code==='Escape')pause()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});window.addEventListener('resize',resize);generate();mainAction=()=>begin(true);hud();resize();requestAnimationFrame(frame);
})();
</script>
</body></html>
